migration_db_env = "ENV_DB"
timezone = "Europe/Moscow"

; Язык шаблонов приложения (Layout/*.twig, письма, статические страницы).
; Без него фреймворк откатывается на "en", и служебные страницы —
; в первую очередь заглушка обслуживания — показываются по-английски.
default_locale = "ru"

protocol = "https"
env = "prod"

base_url = "https://test-app.example"

title = "IRabi"
description = "IRabi"
registrations_enabled = 1

admin_emails[] = "admin@example.com"
moderator_emails[] = "admin@example.com"
