; Off-site backup upload configuration (WebDAV).
;
; The db-backup cron task (Common/Services/DbBackupCronTask.php) takes a
; local DB snapshot every tick and then optionally pushes the fresh dump
; to a remote WebDAV server (Nextcloud / ownCloud / Box / rclone serve
; webdav / any standard WebDAV endpoint). This file configures that leg.
;
; WHEN THIS FILE IS ABSENT OR url IS EMPTY:
;   The cron task prints a one-line warning ("db-backup: off-site upload
;   not configured, backup stays local-only.") and continues normally —
;   the LOCAL backup is still created and is valuable on its own. This is
;   the default on the dev stand and on any prod box where ops haven't
;   provisioned a remote yet. No error, no failed cron tick.
;
; HTTPS IS REQUIRED: a plain http:// url is rejected even when creds are
; present — silently broadcasting a full DB dump (and Basic-auth creds)
; over plaintext is worse than not shipping it at all. Use https:// only.
;
; CREDENTIALS: this file lives under WorkDir/Config/ and is gitignored
; (same protection as db.ini). The user:password pair is passed to curl
; via the --user flag, NOT embedded in the URL, so it stays out of
; server-side request logs.
;
; CRON SCHEDULE: this INI does NOT control when backups happen. Add a
; crontab line on the prod box, e.g. for a 03:00 daily backup:
;     0 3 * * *  cd /var/www/irabi && php run_cmd.php cron db-backup >> WorkDir/Logs/db-backup.log 2>&1
; The db-backup task is idempotent (each run produces one timestamped
; file) and self-pruning, so accidental double-runs only cost disk for
; the retention window (7 daily + 4 weekly — see DbBackupRetentionService).

[webdav]
; Uncomment and fill in to enable off-site upload.
; url = "https://webdav.example.com/irabi-backups/"
; user = "backup-user"
; password = "s3cret"
url = ""
user = ""
password = ""
